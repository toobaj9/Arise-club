<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login - ARISE Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>


  <section class="login-section">
    <div class="login-container">
      <div class="login-header">
        <h2>Reset Password</h2>
      </div>
      {% with messages = get_flashed_messages() %}
        {% if messages %} 
          <div class="flash-messages">
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div class="login-form-container">
        <div class="inner_box_login">
          <form class="login-form" id="loginForm" method="POST" action="{{ url_for('reset-token', token=token) }}">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
            </div>
            
            <div class="form-group">
              <label for="password">New Password</label>
              <input type="password" id="password" name="password" placeholder="Enter new password" required minlength="8">
            </div>
            
			<div class="form-group">
              <label for="password">Confirm New Password</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required minlength="8">
            </div>
            
            <button type="submit" class="login-btn">Reset</button>
          </form>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
